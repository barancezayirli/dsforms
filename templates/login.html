<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Login — dsforms</title>
  <link rel="icon" href="/static/favicon.svg?v={{.AssetVer}}" type="image/svg+xml">
  <!-- The same stylesheet the admin uses. This page used to carry its own copy
       of the design tokens, which is how the two drifted apart. -->
  <link rel="stylesheet" href="/static/app.css?v={{.AssetVer}}">
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden">
    <!-- Decorative glow above the card. pointer-events:none so it never eats a
         click on the form beneath it. -->
    <div aria-hidden="true" style="position:absolute;top:-160px;left:50%;transform:translateX(-50%);
         width:760px;height:420px;max-width:150vw;border-radius:50%;pointer-events:none;
         background:radial-gradient(closest-side,var(--a-900),transparent)"></div>

    <div style="width:min(380px,100%);position:relative">
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px">
        <span class="brand-mark" style="width:30px;height:30px">
          <svg class="i" style="font-size:17px"><use href="#ph-tray-arrow-down"/></svg>
        </span>
        <span class="brand-word" style="font-size:20px">ds<em>forms</em></span>
      </div>

      <form class="card elev-md" method="POST" action="/admin/login" style="padding:22px">
        {{if .LoginError}}
        <!-- Tinted, not red: Nocturne is a mono palette and this is the same
             notice treatment every other warning in the admin uses. -->
        <div class="notice" style="margin-bottom:14px">
          <svg class="i"><use href="#ph-warning"/></svg>
          <span>Invalid username or password.</span>
        </div>
        {{end}}

        <label class="field">
          <span>Username</span>
          <input class="input" name="username" required autofocus autocomplete="username">
        </label>
        <label class="field">
          <span>Password</span>
          <input class="input" type="password" name="password" required autocomplete="current-password">
        </label>

        <button class="btn btn-primary btn-block" type="submit" style="height:38px">Log in</button>

        <p class="dim" style="font-size:11px;text-align:center;margin-top:12px">
          5 attempts, then a 15-minute lockout on this IP.
        </p>
      </form>

      <p class="dim" style="font-size:11px;text-align:center;margin-top:14px">
        {{.Host}} · dsforms {{.Version}} · self-hosted
      </p>
    </div>
  </main>
  {{template "icons"}}
</body>
</html>
