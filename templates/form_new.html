{{template "base" .}}

{{define "content"}}
<div class="page-head">
  <h4>New form</h4>
  <span class="muted" style="font-size:13px">A name and a notify address is all it needs.</span>
</div>

{{if .Error}}
<div class="notice">
  <svg class="i"><use href="#ph-warning"/></svg><span>{{.Error}}</span>
</div>
{{end}}

<form method="POST" action="/admin/forms/new" style="max-width:560px">
  <div class="card elev-sm">
    <label class="field">
      <span>Name</span>
      <input class="input" name="name" value="{{.Form.Name}}" required autofocus placeholder="Contact form">
    </label>
    <label class="field">
      <span>Notify address</span>
      <input class="input" type="email" name="email_to" value="{{.Form.EmailTo}}" placeholder="you@example.com">
      <span class="form-hint">Leave empty to store submissions without emailing anyone.</span>
    </label>
    <label class="field">
      <span>Redirect after submit</span>
      <input class="input" name="redirect" value="{{.Form.Redirect}}" placeholder="https://yoursite.com/thanks">
      <span class="form-hint">Also the allowlist for <code>_redirect</code>: any URL on this origin is accepted.</span>
    </label>
    <label class="field">
      <span>Webhook URL</span>
      <input class="input" name="webhook_url" value="{{.Form.WebhookURL}}" placeholder="https://hooks.slack.com/services/…">
    </label>
    <label class="field" style="margin-bottom:0">
      <span>Webhook format</span>
      <select class="input" name="webhook_format">
        <option value=""        {{if eq .Form.WebhookFormat ""}}selected{{end}}>None</option>
        <option value="generic" {{if eq .Form.WebhookFormat "generic"}}selected{{end}}>Generic JSON</option>
        <option value="slack"   {{if eq .Form.WebhookFormat "slack"}}selected{{end}}>Slack</option>
        <option value="discord" {{if eq .Form.WebhookFormat "discord"}}selected{{end}}>Discord</option>
      </select>
    </label>
  </div>

  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn btn-primary" type="submit">
      <svg class="i" style="font-size:15px"><use href="#ph-plus"/></svg>Create form
    </button>
    <a class="btn btn-secondary" href="/admin/forms">Cancel</a>
  </div>
</form>
{{end}}
