name: Build and Push Docker Image

on:
  push:
    tags: ["v*"]
  # Lets an already-created tag be published manually — needed because tag
  # pushes made by auto-tag.yml's default GITHUB_TOKEN don't cascade-trigger
  # this workflow (GitHub blocks GITHUB_TOKEN-authored events from starting
  # other workflow runs, to prevent infinite chains). See auto-tag.yml for
  # the actual fix (a PAT); this is the manual recovery path.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
