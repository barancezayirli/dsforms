name: Auto Tag on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN does not trigger other
          # workflows (GitHub blocks GITHUB_TOKEN-authored events from
          # cascading, to prevent infinite chains) — so docker-publish.yml's
          # `push: tags: ["v*"]` never fired for any tag this workflow made.
          # RELEASE_PAT (a fine-grained PAT with Contents: read/write on this
          # repo, added as a repo secret) lets the tag push trigger it
          # normally. Falls back to GITHUB_TOKEN — today's broken-but-working
          # behavior — if the secret isn't set yet.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Determine version bump
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest=$LATEST"

          MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)

          if echo "$PR_TITLE" | grep -qiE '^feat!|BREAKING CHANGE'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$PR_TITLE" | grep -qiE '^feat'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "new_tag=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

      - name: Regenerate changelog on main
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The pull_request checkout is a detached merge ref; move onto main so
          # the changelog commit lands there. The new tag is already in the local
          # tag db, so the generator picks it up.
          git fetch origin main
          git checkout -B main origin/main

          bash scripts/changelog.sh > CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date."
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${NEW_TAG}"
          git push origin HEAD:main
